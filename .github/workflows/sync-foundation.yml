name: Sync foundation candidate
on:
  pull_request:
    paths: ['Packages/SyncFoundation/**', 'Scripts/SyncSchemaAudit/**', 'Scripts/FormalDevelopmentHost/**', 'Docs/Evidence/iCloudSyncFoundation/20261108/schema-audit/review/review_schema.py', 'Docs/Evidence/iCloudSyncFoundation/20261108/sdk-preparation/review/IndependentSDKTests.swift', 'Docs/Evidence/iCloudSyncFoundation/20261108/formal-signing-qualification/review-allowance/IndependentAllowanceReviewTests.swift', 'Docs/Evidence/iCloudSyncFoundation/20261108/formal-signing-qualification/review-host/*.swift', 'Docs/Evidence/iCloudSyncFoundation/20261107/review-v2/IndependentChunkTests.swift', 'Docs/Evidence/iCloudSyncFoundation/20261107/formal-probe/review/review_cli.py', '.github/workflows/sync-foundation.yml']
permissions:
  contents: read
concurrency:
  group: sync-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native candidate contract tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sync-foundation-evidence"
          xcodebuild -version | tee "$RUNNER_TEMP/sync-foundation-evidence/environment.log"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sync-foundation-evidence/checkout-sha.txt"
          swift test --package-path Packages/SyncFoundation --scratch-path "$RUNNER_TEMP/sync-foundation-build" 2>&1 | tee "$RUNNER_TEMP/sync-foundation-evidence/tests.log"
          swift run --package-path Packages/SyncFoundation --scratch-path "$RUNNER_TEMP/sync-foundation-build" SyncSchema "$RUNNER_TEMP/sync-foundation-evidence/schema"
      - name: Retained independent chunk regressions
        run: |
          set -o pipefail
          cp -R Packages/SyncFoundation "$RUNNER_TEMP/sync-review-package"
          cp Docs/Evidence/iCloudSyncFoundation/20261107/review-v2/IndependentChunkTests.swift "$RUNNER_TEMP/sync-review-package/Tests/SyncFoundationTests/IndependentChunkTests.swift"
          # The exact 49MB V16 input is generated locally from the frozen product baseline.
          # Keep that local evidence separate; run the other 11 self-contained regressions here.
          swift test --package-path "$RUNNER_TEMP/sync-review-package" --scratch-path "$RUNNER_TEMP/sync-review-build" --filter IndependentChunkTests --skip '.*testActualV16MaximumLegalPayloadHasTwelveChunksAndExactReplay' 2>&1 | tee "$RUNNER_TEMP/sync-foundation-evidence/independent-regressions.log"
      - name: Formal Development batch offline replay and signing rejection
        run: |
          set -o pipefail
          probe_root=$(cd "$RUNNER_TEMP" && pwd -P)
          export RUNNER_TEMP="$probe_root"
          evidence="$RUNNER_TEMP/sync-foundation-evidence"
          swift run --package-path Packages/SyncFoundation --scratch-path "$RUNNER_TEMP/sync-foundation-build" FormalDevelopmentProbe plan "$evidence/formal-plan"
          plan_sha=$(cat "$evidence/formal-plan/plan.sha256")
          swift run --package-path Packages/SyncFoundation --scratch-path "$RUNNER_TEMP/sync-foundation-build" FormalDevelopmentProbe replay "$evidence/formal-plan" "$plan_sha" "$evidence/formal-replay"
          probe_bin=$(swift build --package-path Packages/SyncFoundation --scratch-path "$RUNNER_TEMP/sync-foundation-build" --show-bin-path)/FormalDevelopmentProbe
          set +e
          "$probe_bin" preflight "$evidence/formal-plan" "$plan_sha" "$probe_bin" "$evidence/formal-preflight"
          preflight_exit=$?
          set -e
          test "$preflight_exit" -eq 2
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sync-foundation-evidence'
          replay = json.loads((root / 'formal-replay/report.json').read_text())
          preflight = json.loads((root / 'formal-preflight/report.json').read_text())
          assert replay['mode'] == 'OFFLINE_ONLY' and replay['status'] == 'OFFLINE_PASS'
          assert len(replay['commands']) == 6 and all(x['status'] == 'OFFLINE_PASS' for x in replay['commands'])
          assert replay['networkOperations'] == 0 and not replay['p0Passed'] and not replay['serverSchemaChecked']
          assert preflight['mode'] == 'OFFLINE_ONLY' and preflight['operation'] == 'READ_ONLY_PREFLIGHT'
          assert preflight['status'] == 'NOT_READY' and 'PROFILE_MISSING' in preflight['rejectionCodes']
          assert not preflight['networkAuthorized'] and not preflight['readyForCloudRun'] and not preflight['p0Passed']
          assert preflight['planSHA256'] == replay['planSHA256']
          print('Six offline SDK checks passed; actual unprovisioned signing preflight correctly rejected.')
          PY
      - name: Independent formal batch CLI regressions
        run: |
          set -o pipefail
          probe_bin=$(swift build --package-path Packages/SyncFoundation --scratch-path "$RUNNER_TEMP/sync-foundation-build" --show-bin-path)/FormalDevelopmentProbe
          python3 Docs/Evidence/iCloudSyncFoundation/20261107/formal-probe/review/review_cli.py "$probe_bin" "$RUNNER_TEMP/sync-foundation-evidence/formal-independent" | tee "$RUNNER_TEMP/sync-foundation-evidence/formal-independent.log"
      - name: Synthetic schema tests and locked Development host
        run: |
          set -o pipefail
          probe_root=$(cd "$RUNNER_TEMP" && pwd -P)
          evidence="$probe_root/sync-foundation-evidence"
          python3 -m unittest discover -s Scripts/SyncSchemaAudit -p 'test_*.py' -v 2>&1 | tee "$evidence/schema-audit-tests.log"
          host_bin=$(swift build --package-path Packages/SyncFoundation --scratch-path "$probe_root/sync-foundation-build" --show-bin-path)/FormalDevelopmentHost
          plan_sha=$(cat "$evidence/formal-plan/plan.sha256")
          set +e
          "$host_bin" inspect "$evidence/formal-plan" "$plan_sha" "$evidence/locked-host"
          host_exit=$?
          set -e
          test "$host_exit" -eq 2
          python3 - "$evidence" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          host = json.loads((root / 'locked-host/report.json').read_text())
          assert host['mode'] == 'OFFLINE_ONLY' and host['status'] == 'NOT_READY'
          assert host['networkOperations'] == 0 and not host['networkAuthorized'] and not host['p0Passed']
          assert host['failure'] == 'EXTERNAL_GATE_NOT_COMPLETE'
          print('Development host remains locked without network operations; schema parser inputs are synthetic only.')
          PY
      - name: Independent schema and SDK boundary regressions
        run: |
          set -o pipefail
          python3 Scripts/SyncSchemaAudit/review_schema.py Scripts/SyncSchemaAudit/audit.py "$RUNNER_TEMP/sync-foundation-evidence/schema/schema.json" "$RUNNER_TEMP/sync-foundation-evidence/schema-independent" | tee "$RUNNER_TEMP/sync-foundation-evidence/schema-independent.log"
          cp Docs/Evidence/iCloudSyncFoundation/20261108/sdk-preparation/review/IndependentSDKTests.swift "$RUNNER_TEMP/sync-review-package/Tests/FormalDevelopmentSDKTests/IndependentSDKTests.swift"
          swift test --package-path "$RUNNER_TEMP/sync-review-package" --scratch-path "$RUNNER_TEMP/sync-review-build" --filter IndependentSDKTests 2>&1 | tee "$RUNNER_TEMP/sync-foundation-evidence/sdk-independent.log"
      - name: Independent provisioning allowance regressions
        run: |
          set -o pipefail
          cp Docs/Evidence/iCloudSyncFoundation/20261108/formal-signing-qualification/review-allowance/IndependentAllowanceReviewTests.swift "$RUNNER_TEMP/sync-review-package/Tests/FormalProbeCoreTests/IndependentAllowanceReviewTests.swift"
          swift test --package-path "$RUNNER_TEMP/sync-review-package" --scratch-path "$RUNNER_TEMP/sync-review-build" --filter IndependentAllowanceReviewTests 2>&1 | tee "$RUNNER_TEMP/sync-foundation-evidence/profile-allowance-independent.log"
      - name: Independent sandbox directory and locked fixture regressions
        run: |
          set -o pipefail
          cp Docs/Evidence/iCloudSyncFoundation/20261108/formal-signing-qualification/review-host/IndependentDirectoryReviewTests.swift "$RUNNER_TEMP/sync-review-package/Tests/FormalProbeCoreTests/IndependentDirectoryReviewTests.swift"
          cp Docs/Evidence/iCloudSyncFoundation/20261108/formal-signing-qualification/review-host/IndependentFixtureReviewTests.swift "$RUNNER_TEMP/sync-review-package/Tests/FormalDevelopmentSDKTests/IndependentFixtureReviewTests.swift"
          swift test --package-path "$RUNNER_TEMP/sync-review-package" --scratch-path "$RUNNER_TEMP/sync-review-build" --filter 'IndependentDirectoryReviewTests|IndependentFixtureReviewTests' 2>&1 | tee "$RUNNER_TEMP/sync-foundation-evidence/locked-host-independent.log"
      - name: Package and inspect the isolated unprovisioned Mac host
        run: |
          set -o pipefail
          probe_root=$(cd "$RUNNER_TEMP" && pwd -P)
          evidence="$probe_root/sync-foundation-evidence/host-packaging"
          mkdir -p "$evidence"
          python3 Scripts/FormalDevelopmentHost/package_locked_host.py --output "$probe_root/locked-host-package" 2>&1 | tee "$evidence/package.log"
          probe_bin=$(swift build --package-path Packages/SyncFoundation --scratch-path "$probe_root/sync-foundation-build" --show-bin-path)/FormalDevelopmentProbe
          python3 Scripts/FormalDevelopmentHost/verify_packaging.py --package-output "$probe_root/locked-host-package" --probe-binary "$probe_bin" --evidence-output "$probe_root/locked-host-checks" 2>&1 | tee "$evidence/verification.log"
          # Verification creates deliberate symlinks in its private scratch root. Upload only named report files.
          cp "$probe_root/locked-host-package/packaging.json" "$evidence/packaging.json"
          cp "$probe_root/locked-host-checks/checks.json" "$evidence/checks.json"
          cp "$probe_root/locked-host-checks/actual-code-signature.json" "$evidence/actual-code-signature.json"
          cp "$probe_root/locked-host-checks/inspect/report.json" "$evidence/inspect-report.json"
          cp "$probe_root/locked-host-checks/preflight/report.json" "$evidence/preflight-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sync-foundation-candidate
          path: ${{ runner.temp }}/sync-foundation-evidence
          retention-days: 7
